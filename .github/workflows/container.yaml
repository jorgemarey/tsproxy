name: Container image

on:
  release:
    types: [published]
  # Build the image for an existing release, e.g. one tagged before this
  # workflow existed. The Dockerfile comes from the branch the workflow runs
  # on and the source from the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.2.0
        required: true
      latest:
        description: Also tag the image as latest
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
    - name: Check out the Dockerfile
      uses: actions/checkout@v7
      with:
        path: build
    - name: Check out the release source
      uses: actions/checkout@v7
      with:
        ref: ${{ env.TAG }}
        path: src

    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE }}
        # v0.2.0 is tagged 0.2.0 and 0.2. latest is moved by stable releases,
        # and by manual builds only when asked.
        flavor: latest=false
        tags: |
          type=semver,pattern={{version}},value=${{ env.TAG }}
          type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
          type=raw,value=latest,enable=${{ inputs.latest || (github.event_name == 'release' && !github.event.release.prerelease) }}
        labels: |
          org.opencontainers.image.title=tsproxy
          org.opencontainers.image.description=Expose services on a Tailscale tailnet as their own device, without Tailscale on the host
          org.opencontainers.image.version=${{ env.TAG }}

    - uses: docker/build-push-action@v7
      with:
        context: src
        file: build/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
